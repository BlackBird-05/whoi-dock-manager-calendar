<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dock Master - Berth Reservation System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Custom Scrollbar */
    .timeline-scroll::-webkit-scrollbar { height: 8px; }
    .timeline-scroll::-webkit-scrollbar-track { background: #0f172a; }
    .timeline-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .timeline-scroll::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Structural guards against zero-height flex bugs */
    html, body { height: 100%; margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .calendar-main { flex: 1; display: flex; overflow: hidden; padding: 1rem; gap: 1rem; min-height: 0; }
    .calendar-card { flex: 1; display: flex; overflow: hidden; background-color: rgba(30, 41, 59, 0.5); border: 1px solid rgba(51, 65, 85, 0.6); border-radius: 0.75rem; min-height: 0; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- TOP BAR -->
  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center sticky top-0 z-30 shadow-lg shrink-0">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 p-2 rounded-lg text-white font-bold text-xl">⚓</div>
      <div>
        <h1 class="font-bold text-lg leading-tight text-slate-100">WHOI Marina Berth Reservation</h1>
        <p class="text-xs text-slate-400">Interactive Berth Allocation Calendar</p>
      </div>
    </div>

    <!-- Timeline Navigation -->
    <div class="flex items-center space-x-2 my-2 sm:my-0">
      <button id="btnPrev" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm transition cursor-pointer">← Prev Week</button>
      <button id="btnToday" class="px-3 py-1.5 bg-blue-600/80 hover:bg-blue-600 text-white rounded text-sm font-medium transition cursor-pointer">Today</button>
      <button id="btnNext" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm transition cursor-pointer">Next Week →</button>
      <span id="currentDateRange" class="text-sm font-semibold ml-3 text-blue-300"></span>
    </div>

    <button id="btnNewBooking" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg shadow text-sm transition flex items-center gap-1.5 cursor-pointer">
      <span>+</span> New Reservation
    </button>
  </header>

  <!-- MAIN CALENDAR CONTAINER -->
  <main class="calendar-main flex-1 flex overflow-hidden p-4 gap-4 min-h-0">
    <div class="calendar-card bg-slate-800/50 border border-slate-700/60 rounded-xl flex flex-1 overflow-hidden shadow-2xl min-h-0">
      
      <!-- FIXED LEFT COLUMN: Berths Sidebar -->
      <div class="w-56 shrink-0 border-r border-slate-700 bg-slate-800/90 z-20 flex flex-col">
        <div class="h-12 border-b border-slate-700 px-4 flex items-center font-semibold text-xs text-slate-400 uppercase tracking-wider shrink-0">
          Berth / Max Cap
        </div>
        <div id="berthSidebar" class="flex-1 divide-y divide-slate-700/50 overflow-y-auto">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- SCROLLABLE RIGHT TIMELINE AREA -->
      <div id="timelineContainer" class="flex-1 overflow-x-auto overflow-y-auto timeline-scroll relative flex flex-col">
        <!-- Date Header Row -->
        <div id="dateHeader" class="h-12 border-b border-slate-700 flex shrink-0 sticky top-0 bg-slate-800 z-10">
          <!-- Populated by JS -->
        </div>

        <!-- Grid Body & Reservations -->
        <div id="gridBody" class="flex-1 relative min-h-[320px]">
          <!-- Rows and Booking Cards populated by JS -->
        </div>
      </div>

    </div>
  </main>

  <!-- MODAL: NEW / EDIT RESERVATION -->
  <div id="reservationModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-xl rounded-xl shadow-2xl overflow-hidden transform transition-all">
      <div class="bg-slate-700/50 px-6 py-4 border-b border-slate-700 flex justify-between items-center">
        <h3 class="text-lg font-bold text-slate-100" id="modalTitle">Reserve Berth Slot</h3>
        <button id="closeModal" class="text-slate-400 hover:text-white text-xl font-bold cursor-pointer">&times;</button>
      </div>

      <form id="bookingForm" class="p-6 space-y-4 text-sm">
        <div id="modalAlert" class="hidden p-3 rounded-lg bg-red-900/40 border border-red-500/50 text-red-200 text-xs font-medium"></div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-slate-300 mb-1 font-medium">Vessel Name *</label>
            <input type="text" id="vesselName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500" placeholder="e.g. RV Atlantis">
          </div>
          <div>
            <label class="block text-slate-300 mb-1 font-medium">Vessel Length (meters) *</label>
            <input type="number" id="vesselLength" min="1" step="0.1" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500" placeholder="e.g. 89">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-slate-300 mb-1 font-medium">Target Berth *</label>
            <select id="berthSelect" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
            </select>
          </div>
          <div>
            <label class="block text-slate-300 mb-1 font-medium">Operator / Shipping Line *</label>
            <input type="text" id="operator" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500" placeholder="e.g. WHOI Marine Ops">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-slate-300 mb-1 font-medium">Start Date *</label>
            <input type="date" id="startDate" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-slate-300 mb-1 font-medium">End Date *</label>
            <input type="date" id="endDate" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <hr class="border-slate-700/60 my-2">

        <h4 class="font-semibold text-slate-300 text-xs uppercase tracking-wider">Contact Information</h4>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-slate-400 text-xs mb-1">Contact Name *</label>
            <input type="text" id="contact" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-slate-400 text-xs mb-1">Work Phone</label>
            <input type="tel" id="workNum" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-slate-400 text-xs mb-1">Cell Phone *</label>
            <input type="tel" id="cellNum" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
          </div>
        </div>
        <div>
          <label class="block text-slate-400 text-xs mb-1">Email Address *</label>
          <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
        </div>

        <div class="flex justify-end space-x-3 pt-4">
          <button type="button" id="btnCancelModal" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-200 transition cursor-pointer">Cancel</button>
          <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg shadow transition cursor-pointer">Save Reservation</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: VIEW / CANCEL RESERVATION DETAILS -->
  <div id="detailsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-xl shadow-2xl overflow-hidden">
      <div class="bg-slate-700/50 px-6 py-4 border-b border-slate-700 flex justify-between items-center">
        <h3 class="text-lg font-bold text-slate-100" id="detailVesselName">Vessel Details</h3>
        <button id="closeDetailsModal" class="text-slate-400 hover:text-white text-xl font-bold cursor-pointer">&times;</button>
      </div>
      <div class="p-6 space-y-3 text-sm" id="detailContent"></div>
      <div class="bg-slate-900/60 px-6 py-3 border-t border-slate-700/80 flex justify-between items-center">
        <button id="btnDeleteBooking" class="bg-red-600/80 hover:bg-red-600 text-white font-medium px-4 py-2 rounded-lg text-xs transition cursor-pointer">Cancel Booking</button>
        <button id="btnCloseDetails" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-xs transition cursor-pointer">Close</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT APP CORE -->
  <script>
  // 1. SUPABASE INITIALIZATION SAFEGUARD (Renamed instance to 'supabaseClient')
  const SUPABASE_URL = 'https://your-project.supabase.co';
  const SUPABASE_KEY = 'your-anon-key';
  
  let supabaseClient = null;
  if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) {
      console.warn('Supabase client initialization skipped. Running in local mode.');
    }
  }

  // 2. DATA STATE & CONFIG
  const berths = [
    { id: 'b1', name: 'Berth 01 - North Quay', maxLength: 120 },
    { id: 'b2', name: 'Berth 02 - Mid Basin', maxLength: 200 },
    { id: 'b3', name: 'Berth 03 - Deepwater Pier', maxLength: 320 },
    { id: 'b4', name: 'Berth 04 - South Container', maxLength: 250 },
    { id: 'b5', name: 'Berth 05 - West Terminal', maxLength: 150 }
  ];

  let reservations = [];
  let viewStartDate = new Date();
  viewStartDate.setHours(0, 0, 0, 0);
  viewStartDate.setDate(viewStartDate.getDate() - 3);

  const DAYS_TO_SHOW = 14; 
  const DAY_WIDTH_PX = 140; 
  let activeReservationId = null;

  function parseDate(str) {
    if (!str) return new Date();
    const parts = str.split('-');
    return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  }

  function getDemoReservations() {
    const today = new Date();
    const fmt = (offsetDays) => {
      const d = new Date(today);
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    };

    return [
      {
        id: 'demo-1',
        berthId: 'b1',
        vesselName: 'RV Atlantis',
        vesselLength: 89,
        operator: 'WHOI Marine Ops',
        contact: 'Capt. J. Miller',
        workNum: '508-555-0144',
        cellNum: '508-555-0199',
        email: 'atlantis-ops@whoi.edu',
        startDate: fmt(-1),
        endDate: fmt(3)
      },
      {
        id: 'demo-2',
        berthId: 'b3',
        vesselName: 'EV Nautilus',
        vesselLength: 64,
        operator: 'Ocean Exploration Trust',
        contact: 'Dr. R. Ballard',
        workNum: '508-555-0210',
        cellNum: '508-555-0288',
        email: 'dispatch@oet.org',
        startDate: fmt(1),
        endDate: fmt(6)
      },
      {
        id: 'demo-3',
        berthId: 'b2',
        vesselName: 'MV Neil Armstrong',
        vesselLength: 72,
        operator: 'US Navy / WHOI',
        contact: 'Sarah Jenkins',
        workNum: '508-555-0812',
        cellNum: '508-555-0890',
        email: 'sjenkins@whoi.edu',
        startDate: fmt(4),
        endDate: fmt(8)
      }
    ];
  }

  // Guaranteed Startup Execution (Bypasses DOMContentLoaded race conditions)
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }

  function initApp() {
    initBerthOptions();
    if (!reservations || reservations.length === 0) {
      reservations = getDemoReservations();
    }
    renderCalendar();

    bindClick('btnPrev', () => shiftDays(-7));
    bindClick('btnNext', () => shiftDays(7));
    bindClick('btnToday', resetToToday);
    bindClick('btnNewBooking', () => openModal());
    bindClick('closeModal', closeModal);
    bindClick('btnCancelModal', closeModal);
    bindClick('closeDetailsModal', closeDetailsModal);
    bindClick('btnCloseDetails', closeDetailsModal);
    bindClick('btnDeleteBooking', handleCancelBooking);

    const form = document.getElementById('bookingForm');
    if (form) form.addEventListener('submit', handleFormSubmit);
  }

  function bindClick(id, handler) {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', handler);
  }

  function initBerthOptions() {
    const sidebar = document.getElementById('berthSidebar');
    const select = document.getElementById('berthSelect');
    if (!sidebar || !select) return;
    
    sidebar.innerHTML = '';
    select.innerHTML = '';

    berths.forEach(b => {
      const div = document.createElement('div');
      div.className = 'h-16 px-4 flex flex-col justify-center border-b border-slate-700/50 shrink-0';
      div.style.height = '64px';
      div.innerHTML = `
        <div class="font-medium text-slate-200 text-sm">${b.name}</div>
        <div class="text-xs text-emerald-400 font-mono">Max Cap: ${b.maxLength}m</div>
      `;
      sidebar.appendChild(div);

      const opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = `${b.name} (${b.maxLength}m max)`;
      select.appendChild(opt);
    });
  }

  function resetToToday() {
    viewStartDate = new Date();
    viewStartDate.setHours(0, 0, 0, 0);
    viewStartDate.setDate(viewStartDate.getDate() - 3);
    renderCalendar();
  }

  function shiftDays(days) {
    viewStartDate.setDate(viewStartDate.getDate() + days);
    renderCalendar();
  }

  function renderCalendar() {
    const header = document.getElementById('dateHeader');
    const grid = document.getElementById('gridBody');
    const dateRangeDisplay = document.getElementById('currentDateRange');

    if (!header || !grid) return;

    header.innerHTML = '';
    grid.innerHTML = '';

    const totalWidth = DAYS_TO_SHOW * DAY_WIDTH_PX;
    header.style.width = `${totalWidth}px`;
    grid.style.width = `${totalWidth}px`;
    grid.style.height = `${berths.length * 64}px`;

    const endDate = new Date(viewStartDate);
    endDate.setDate(endDate.getDate() + DAYS_TO_SHOW - 1);

    if (dateRangeDisplay) {
      dateRangeDisplay.textContent = `${viewStartDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${endDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
    }

    const todayStr = new Date().toISOString().split('T')[0];

    // Dates Header
    for (let i = 0; i < DAYS_TO_SHOW; i++) {
      const curr = new Date(viewStartDate);
      curr.setDate(curr.getDate() + i);
      const currStr = curr.toISOString().split('T')[0];
      const isToday = currStr === todayStr;

      const col = document.createElement('div');
      col.style.width = `${DAY_WIDTH_PX}px`;
      col.style.minWidth = `${DAY_WIDTH_PX}px`;
      col.className = `border-r border-slate-700/70 flex flex-col items-center justify-center font-medium text-xs ${isToday ? 'bg-blue-900/40 text-blue-300 font-bold border-b-2 border-b-blue-500' : 'text-slate-400'}`;
      
      const dayName = curr.toLocaleDateString('en-US', { weekday: 'short' });
      const dayNum = curr.getDate();
      const monthName = curr.toLocaleDateString('en-US', { month: 'short' });

      col.innerHTML = `<span>${dayName}</span><span class="text-slate-200 text-sm">${monthName} ${dayNum}</span>`;
      header.appendChild(col);
    }

    // Grid Rows
    berths.forEach(berth => {
      const row = document.createElement('div');
      row.className = 'h-16 border-b border-slate-700/50 relative flex hover:bg-slate-800/30 transition';
      row.style.width = `${totalWidth}px`;
      row.style.height = '64px';

      for (let i = 0; i < DAYS_TO_SHOW; i++) {
        const cellDate = new Date(viewStartDate);
        cellDate.setDate(cellDate.getDate() + i);
        const dateStr = cellDate.toISOString().split('T')[0];

        const cell = document.createElement('div');
        cell.style.width = `${DAY_WIDTH_PX}px`;
        cell.style.minWidth = `${DAY_WIDTH_PX}px`;
        cell.className = 'h-full border-r border-slate-700/30 cursor-pointer hover:bg-blue-500/10 transition';
        cell.title = `Click to reserve ${berth.name} on ${dateStr}`;
        cell.addEventListener('click', () => openModal({ berthId: berth.id, startDate: dateStr }));
        row.appendChild(cell);
      }

      grid.appendChild(row);
    });

    // Reservations Render
    reservations.forEach(res => {
      const berthIndex = berths.findIndex(b => b.id === res.berthId);
      if (berthIndex === -1) return;

      const rStart = parseDate(res.startDate);
      const rEnd = parseDate(res.endDate);

      const windowEnd = new Date(viewStartDate);
      windowEnd.setDate(windowEnd.getDate() + DAYS_TO_SHOW);

      if (rEnd < viewStartDate || rStart >= windowEnd) return;

      const diffDaysStart = Math.round((rStart - viewStartDate) / (1000 * 60 * 60 * 24));
      const durationDays = Math.round((rEnd - rStart) / (1000 * 60 * 60 * 24)) + 1;

      const leftPx = Math.max(0, diffDaysStart * DAY_WIDTH_PX);
      const widthPx = durationDays * DAY_WIDTH_PX - 6;

      const card = document.createElement('div');
      card.className = 'absolute bg-gradient-to-r from-blue-600 to-indigo-600 border border-blue-400/50 rounded-lg shadow-lg px-3 py-1 text-white text-xs cursor-pointer hover:scale-[1.01] hover:brightness-110 transition z-10 flex flex-col justify-center overflow-hidden';
      card.style.left = `${leftPx + 3}px`;
      card.style.width = `${Math.max(widthPx, 40)}px`;
      card.style.top = `${berthIndex * 64 + 8}px`;
      card.style.height = '48px';

      card.innerHTML = `
        <div class="font-bold truncate">${res.vesselName} (${res.vesselLength}m)</div>
        <div class="text-[10px] text-blue-200 truncate">${res.operator}</div>
      `;

      card.addEventListener('click', (e) => {
        e.stopPropagation();
        showReservationDetails(res);
      });

      grid.appendChild(card);
    });
  }

  function openModal(prefill = {}) {
    const modal = document.getElementById('reservationModal');
    const alert = document.getElementById('modalAlert');
    if (alert) alert.classList.add('hidden');

    const form = document.getElementById('bookingForm');
    if (form) form.reset();

    if (prefill.berthId) {
      const bSel = document.getElementById('berthSelect');
      if (bSel) bSel.value = prefill.berthId;
    }
    if (prefill.startDate) {
      const sDate = document.getElementById('startDate');
      if (sDate) sDate.value = prefill.startDate;
      const end = parseDate(prefill.startDate);
      end.setDate(end.getDate() + 2);
      const eDate = document.getElementById('endDate');
      if (eDate) eDate.value = end.toISOString().split('T')[0];
    }

    if (modal) {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }
  }

  function closeModal() {
    const modal = document.getElementById('reservationModal');
    if (modal) {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
  }

  function handleFormSubmit(e) {
    e.preventDefault();

    const berthId = document.getElementById('berthSelect').value;
    const vesselLength = parseFloat(document.getElementById('vesselLength').value);
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const alert = document.getElementById('modalAlert');

    const targetBerth = berths.find(b => b.id === berthId);

    if (vesselLength > targetBerth.maxLength) {
      alert.textContent = `❌ Reservation Rejected: Vessel length (${vesselLength}m) exceeds ${targetBerth.name} maximum capacity (${targetBerth.maxLength}m).`;
      alert.classList.remove('hidden');
      return;
    }

    if (parseDate(endDate) < parseDate(startDate)) {
      alert.textContent = `❌ Reservation Rejected: End date cannot be before start date.`;
      alert.classList.remove('hidden');
      return;
    }

    const hasOverlap = reservations.some(res => {
      if (res.berthId !== berthId) return false;
      return (parseDate(startDate) <= parseDate(res.endDate) && parseDate(endDate) >= parseDate(res.startDate));
    });

    if (hasOverlap) {
      alert.textContent = `❌ Reservation Rejected: Selected berth is already booked during these dates.`;
      alert.classList.remove('hidden');
      return;
    }

    const newRecord = {
      id: 'res-' + Date.now(),
      berthId: berthId,
      vesselName: document.getElementById('vesselName').value,
      vesselLength: vesselLength,
      operator: document.getElementById('operator').value,
      contact: document.getElementById('contact').value,
      workNum: document.getElementById('workNum').value,
      cellNum: document.getElementById('cellNum').value,
      email: document.getElementById('email').value,
      startDate: startDate,
      endDate: endDate
    };

    reservations.push(newRecord);
    closeModal();
    renderCalendar();
  }

  function showReservationDetails(res) {
    activeReservationId = res.id;
    const berth = berths.find(b => b.id === res.berthId);
    
    document.getElementById('detailVesselName').textContent = res.vesselName;
    document.getElementById('detailContent').innerHTML = `
      <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700/60 space-y-1">
        <div class="text-xs text-blue-400 font-semibold uppercase">Berth Location</div>
        <div class="text-slate-100 font-medium">${berth ? berth.name : 'Unknown Berth'}</div>
        <div class="text-xs text-slate-400">Max Capacity: ${berth ? berth.maxLength : 'N/A'}m | Vessel: ${res.vesselLength}m</div>
      </div>

      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="bg-slate-900/40 p-2.5 rounded border border-slate-700/40">
          <span class="text-slate-400 block">Arrival:</span>
          <span class="font-medium text-slate-200">${res.startDate}</span>
        </div>
        <div class="bg-slate-900/40 p-2.5 rounded border border-slate-700/40">
          <span class="text-slate-400 block">Departure:</span>
          <span class="font-medium text-slate-200">${res.endDate}</span>
        </div>
      </div>

      <div class="bg-slate-900/40 p-3 rounded-lg border border-slate-700/40 space-y-1 text-xs">
        <div class="text-slate-400 font-semibold mb-1">Operator & Contact Details</div>
        <div><strong class="text-slate-300">Operator:</strong> ${res.operator}</div>
        <div><strong class="text-slate-300">Contact:</strong> ${res.contact}</div>
        <div><strong class="text-slate-300">Cell:</strong> ${res.cellNum}</div>
        <div><strong class="text-slate-300">Work Phone:</strong> ${res.workNum || 'N/A'}</div>
        <div><strong class="text-slate-300">Email:</strong> ${res.email}</div>
      </div>
    `;

    const detailsModal = document.getElementById('detailsModal');
    if (detailsModal) {
      detailsModal.classList.remove('hidden');
      detailsModal.classList.add('flex');
    }
  }

  function closeDetailsModal() {
    const detailsModal = document.getElementById('detailsModal');
    if (detailsModal) {
      detailsModal.classList.add('hidden');
      detailsModal.classList.remove('flex');
    }
    activeReservationId = null;
  }

  function handleCancelBooking() {
    if (!activeReservationId) return;
    if (confirm('Are you sure you want to cancel this berth reservation?')) {
      reservations = reservations.filter(r => r.id !== activeReservationId);
      closeDetailsModal();
      renderCalendar();
    }
  }
  </script>
</body>
</html>
